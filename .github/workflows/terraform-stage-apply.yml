name: Terraform Stage Apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY to create or update stage resources in Azure."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform-stage
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: live/stage/webserver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require explicit deployment confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CONFIRMATION" != "APPLY" ]; then
            echo "::error::Type APPLY to continue."
            exit 1
          fi

      - name: Check VM administrator public key
        run: |
          if [ -z "$TF_VAR_admin_ssh_public_key" ]; then
            echo "::error::Set ADMIN_SSH_PUBLIC_KEY in the GitHub stage environment to create the VM."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform and remote backend
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Create and display Terraform plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan

      - name: Upload saved Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-stage-plan
          path: live/stage/webserver/tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}
    defaults:
      run:
        working-directory: live/stage/webserver
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Initialize Terraform and remote backend
        run: terraform init -input=false

      - name: Download saved Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-stage-plan
          path: live/stage/webserver

      - name: Apply the saved plan
        run: terraform apply -input=false -no-color tfplan
