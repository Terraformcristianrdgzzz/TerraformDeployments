name: Terraform Stage Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check public SSH key configuration
        run: |
          if [ -z "$TF_VAR_admin_ssh_public_key" ]; then
            echo "::error::Set ADMIN_SSH_PUBLIC_KEY in the GitHub stage environment."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check Terraform formatting
        working-directory: live/stage/webserver
        run: terraform fmt -check -recursive

      - name: Initialize Terraform and remote backend
        working-directory: live/stage/webserver
        run: terraform init -input=false

      - name: Validate Terraform configuration
        working-directory: live/stage/webserver
        run: terraform validate -no-color

      - name: Create Terraform plan
        working-directory: live/stage/webserver
        run: terraform plan -input=false -no-color -out=tfplan